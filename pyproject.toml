[project]
name = "Correlation-Analysis"
version = "v1"
authors = [
    { name = "Youngwoo Choi", email = "uoise@wisenut.co.kr" },
]
maintainers = [
    { name = "Chanhyeong Lee", email = "wisnt65@wisenut.co.kr" },
    { name = "Seoyeon Park", email = "sally9476@wisenut.co.kr" },
    { name = "Youngwoo Choi", email = "uoise@wisenut.co.kr" },
]
description = "Column to Column Correlation Analysis"
readme = "README.md"
keywords = ["python", "fastapi", "pytest", "ruff", "pyright", "docker", "gunicorn", "uv"]
license = { text = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pytest",
    "Natural Language :: Korean",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Intended Audience :: Developers"
]
excludes = [".gitlab-ci.yml"]

requires-python = "<3.13,>=3.11"
dependencies = [
    "fastapi[standard]<=0.115.0",
    "loguru<1.0.0,>=0.7.2",
    "pyyaml<7.0.0,>=6.0.2",
    "pydantic-settings<3.0.0,>=2.5.2",
    "numpy<3.0.0,>=2.1.2",
    "pandas<3.0.0,>=2.1.0",
    "nltk==3.9.1",
    "python-dateutil==2.8.2",
    "strsimpy==0.2.1",
    "scikit-learn<2.0.0,>=1.4.0",
    "validators<1.0.0,>=0.34.0",
    "pandas-stubs<3.0.0.0,>=2.2.3.241126",
    "sentence-transformers==3.2.1",
    "boto3>=1.37.24",
    "pyarrow>=19.0.1",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.5.1",
    "xgboost-cpu>=2.1.0",
]
cu124 = [
    "torch>=2.5.1",
    "xgboost>=2.1.0",
]

[dependency-groups]
lint = [
    "ruff>=0.11.6",
    "pyright>=1.1.397",
    "pre-commit>=4.0.1,<5.0.0",
]
test = [
    "pytest<9.0.0,>=8.3.3",
    "pytest-cov<6.0.0,>=5.0.0",
    "tabulate<1.0.0,>=0.9.0",
]
gunicorn = [
    "gunicorn<24.0.0,>=23.0.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu124" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "platform_system != 'Darwin'" },
    { index = "pytorch-cu124", extra = "cu124", marker = "platform_system != 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true


[tool.setuptools]
py-modules = ["app"]


[tool.ruff]
line-length = 125
exclude = [
    '.git',
    '__pycache__',
    '.ruff_cache',
    'docs',
    'venv',
    'tests',
    'build',
    'dist',
    './app/__init__.py',
    'gunicorn.conf.py'
]
target-version = "py311"

[tool.ruff.lint]
select = [
    "D",    # pydocstyle <https://docs.astral.sh/ruff/rules/#pydocstyle-d>
    "FAST"  # FastAPI <https://docs.astral.sh/ruff/rules/#fastapi-fast>
]
ignore = ['W', "D100", "D104", "D414", "D415", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.extend-per-file-ignores]
"!app/src/**.py" = ["D"]    # apply `D` rules only in app/src directory

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.pyright]
pythonVersion = "3.11"
defineConstant = { DEBUG = true }
reportMissingImports = false
reportMissingTypeStubs = false
reportArgumentType = false
typeCheckingMode = "basic"
include = ["app"]
exclude = [
    '.git',
    '__pycache__',
    '.ruff_cache',
    '.pytest_cache',
    'docs',
    'venv',
    '.venv',
    'tests',
    'build',
    'dist',
    'pypi',
    'logs',
    'gunicorn.conf.py',
    '.cache'
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/*.py",
    "*/__init__.py",
    "app/api/examples/*.py",
    "app/exceptions/*.py",
]
