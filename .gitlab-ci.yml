# 해당 파이프라인은 GitLab CI Template 프로젝트에서 가져와서 설정하기 때문에 프로젝트 접근 권한이 있어야합니다.
# 만약 접근 권한이 없을 경우, 해당 CI 파일을 직접 가져와서 로컬에서 사용해도 됩니다.
# 또한 GitLab CI 파이프라인은 overriding이 가능하기때문에 템플릿을 가져와서 커스텀을 할 수도 있습니다.
# 참고: https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

# Global Config
default:
  tags:
    - saas-linux-medium-amd64  # 16GB Memory, 50GB storage

.variants:
  variants: &variants
    - cpu
    - cu124

stages:
  - secret_detection
  - deps-build-and-push
  - lint
  - test
  - app-build-and-push
  - container_test

.base-docker:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    PIPELINE_SEQUENCE: $CI_PIPELINE_IID
    TZ: "Asia/Seoul"
    FF_TIMESTAMPS: true
    IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:latest"
    # Use TLS https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#tls-enabled
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache tzdata
    - export TZ=Asia/Seoul  # TODO: 아직까지도 UTC Timezone으로 설정됨
    - |
      set -o allexport
      source .env
      VERSION=${MAJOR_VERSION}.$(date +'%y%m.%d')-${STATUS}-$CI_COMMIT_SHORT_SHA
      set +o allexport
    - IMAGE_TAG=$CI_REGISTRY_IMAGE:$VERSION
    - X_TOKEN=${X_TOKEN}
    - BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')
    - |
      echo "version: str = '$VERSION'" > version_info.py
      echo "git_branch: str = '$CI_COMMIT_BRANCH'" >> version_info.py
      echo "git_revision: str = '$CI_COMMIT_SHA'" >> version_info.py
      echo "git_short_revision: str = '$CI_COMMIT_SHORT_SHA'" >> version_info.py
      echo "build_date: str = '$BUILD_DATE'" >> version_info.py
  script: # docker image cache를 사용하여 이미지 빌드, 컨테이너 레지스트리 푸시 진행
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG_LATEST || true # 마지막 이미지 가져오기
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $IMAGE_TAG_LATEST -t $IMAGE_TAG -t $IMAGE_TAG_LATEST . # 마지막 이미지를 캐시로 사용
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST

.dependency-management:
  parallel:
    matrix:
      - VARIANT: *variants
  image: $CI_REGISTRY_IMAGE:deps-${VARIANT}
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIPELINE_SEQUENCE: $CI_PIPELINE_IID
    TZ: "Asia/Seoul"
    FF_TIMESTAMPS: true

.lint:
  extends: .dependency-management
  stage: lint
  before_script:
    - uv sync --group lint
    - source .venv/bin/activate
  rules:
    - if: '$CI_MERGE_REQUEST_ID == null'
      changes:
        - app/**/*

.unit-test:
  extends: .dependency-management
  stage: test
  before_script:
    - uv sync --group test
    - source .venv/bin/activate
  script:
    - |
      set -o allexport
      source .env
      VERSION=${MAJOR_VERSION}.$(date +'%y%m.%d')-${STATUS}-$CI_COMMIT_SHORT_SHA
      set +o allexport
    - BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')
    - export PYTHONPATH=./app
    - pytest --cov --cov-report term --cov-report xml:coverage.xml --junitxml=report.xml -v tests
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: '$CI_MERGE_REQUEST_ID == null'
      changes:
        - app/**/*


include:
  - project: wisenut-research/starter/gitlab-ci-template
    ref: main
    file:
      - templates/Security/Secret-Detection.gitlab-ci.yml
      - templates/Python/Lint.gitlab-ci.yml
      - templates/Python/Test.gitlab-ci.yml
      - templates/Security/Container-Scanning.gitlab-ci.yml

deps-build-and-push:
  extends: .base-docker
  stage: deps-build-and-push
  parallel:
    matrix:
      - VARIANT: *variants
  variables:
    IMAGE_TAG_CACHE: "$CI_REGISTRY_IMAGE:deps-${VARIANT}"
    IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:deps-${VARIANT}"
  script: # docker image cache를 사용하여 이미지 빌드, 컨테이너 레지스트리 푸시 진행
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG_LATEST || true # 마지막 이미지 가져오기
    - > 
      docker build 
      --build-arg BUILDKIT_INLINE_CACHE=1
      --build-arg VARIANT=$VARIANT
      --cache-from $IMAGE_TAG_CACHE 
      -t $IMAGE_TAG 
      -t $IMAGE_TAG_LATEST 
      -f uv.Dockerfile .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST
  rules:
#    - if: '$CI_COMMIT_BRANCH == "main"'  # main 브랜치일 때만 실행
    - changes:
      - uv.lock
      - pyproject.toml
      - uv.Dockerfile

ruff-lint:
  parallel:
    matrix:
      - PYTHON_VERSION: [ "py311" ]
        VARIANT: *variants

pyright-lint:
  parallel:
    matrix:
      - VARIANT: *variants

pytest-39:
  rules:
    - when: never

pytest-310:
  rules:
    - when: never

pytest-311:
  extends: .unit-test
  parallel:
    matrix:
      - VARIANT: *variants
  image: "$CI_REGISTRY_IMAGE:deps-${VARIANT}"

pytest-312:
  rules:
    - when: never

app-build-and-push:
  extends: .base-docker
  stage: app-build-and-push
  parallel:
    matrix:
      - VARIANT: *variants
  variables:
    VARIANT: cu124
    IMAGE: "$CI_REGISTRY_IMAGE"
    IMAGE_TAG_DEPS: "$IMAGE:deps-$VARIANT"
    IMAGE_TAG_LATEST: "$IMAGE:app-$VARIANT"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG_DEPS || true  # Pull the deps image for caching
    - docker pull $IMAGE_TAG_LATEST || true  # Pull the last full image for caching
    - >
      docker build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --build-arg IMAGE=$IMAGE
      --build-arg VARIANT=$VARIANT
      --cache-from $IMAGE_TAG_LATEST
      -t $IMAGE_TAG
      -t $IMAGE_TAG_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST
#  only:
#    - main
