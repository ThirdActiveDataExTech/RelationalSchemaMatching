# 해당 파이프라인은 GitLab CI Template 프로젝트에서 가져와서 설정하기 때문에 프로젝트 접근 권한이 있어야합니다.
# 만약 접근 권한이 없을 경우, 해당 CI 파일을 직접 가져와서 로컬에서 사용해도 됩니다.
# 또한 GitLab CI 파이프라인은 overriding이 가능하기때문에 템플릿을 가져와서 커스텀을 할 수도 있습니다.
# 참고: https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

# Global Config
default:
  tags:
    - saas-linux-medium-amd64  # 16GB Memory, 50GB storage

stages:
  - secret_detection
  - deps-build-and-push
  - lint
  - test
  - app-build-and-push
  - container_test

.base-docker:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    PIPELINE_SEQUENCE: $CI_PIPELINE_IID
    TZ: "Asia/Seoul"
    FF_TIMESTAMPS: true
    IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:latest"
    # Use TLS https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#tls-enabled
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache tzdata
    - export TZ=Asia/Seoul  # TODO: 아직까지도 UTC Timezone으로 설정됨
    - |
      set -o allexport
      source .env
      VERSION=${MAJOR_VERSION}.$(date +'%y%m.%d')-${STATUS}-$CI_COMMIT_SHORT_SHA
      set +o allexport
    - IMAGE_TAG=$CI_REGISTRY_IMAGE:$VERSION
    - X_TOKEN=${X_TOKEN}
    - BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')
    - |
      echo "version: str = '$VERSION'" > version_info.py
      echo "git_branch: str = '$CI_COMMIT_BRANCH'" >> version_info.py
      echo "git_revision: str = '$CI_COMMIT_SHA'" >> version_info.py
      echo "git_short_revision: str = '$CI_COMMIT_SHORT_SHA'" >> version_info.py
      echo "build_date: str = '$BUILD_DATE'" >> version_info.py
  script: # docker image cache를 사용하여 이미지 빌드, 컨테이너 레지스트리 푸시 진행
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG_LATEST || true # 마지막 이미지 가져오기
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $IMAGE_TAG_LATEST -t $IMAGE_TAG -t $IMAGE_TAG_LATEST . # 마지막 이미지를 캐시로 사용
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST

.dependency-management:
  image: $CI_REGISTRY_IMAGE:deps
  variables:
    POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIPELINE_SEQUENCE: $CI_PIPELINE_IID
    TZ: "Asia/Seoul"
    FF_TIMESTAMPS: true

.pip:
  extends: .dependency-management
  before_script:
    - echo "Running before_script tasks for $CI_JOB_NAME";
    - python3 -V
    - pip install --upgrade pip
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate

.poetry:
  extends: .dependency-management
  before_script:
    - echo "Running before_script tasks for $CI_JOB_NAME";
    - python3 -V
    - pip install --upgrade pip && pip install poetry
    - poetry config virtualenvs.create false --local
    - poetry install --with test,lint --no-root

include:
  - project: wisenut-research/starter/gitlab-ci-template
    ref: main
    file:
      - templates/Python/Dependency-Management.gitlab-ci.yml
      - templates/Security/Secret-Detection.gitlab-ci.yml
      - templates/Python/Lint.gitlab-ci.yml
      - templates/Python/Test.gitlab-ci.yml
      - templates/Security/Container-Scanning.gitlab-ci.yml

deps-build-and-push:
  extends: .base-docker
  stage: deps-build-and-push
  variables:
    IMAGE_TAG_CACHE: "$CI_REGISTRY_IMAGE:deps"
    IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:deps"
  script: # docker image cache를 사용하여 이미지 빌드, 컨테이너 레지스트리 푸시 진행
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG_LATEST || true # 마지막 이미지 가져오기
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $IMAGE_TAG_CACHE --target builder-base -t $IMAGE_TAG -t $IMAGE_TAG_LATEST . # 마지막 이미지를 캐시로 사용
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'  # main 브랜치일 때만 실행
    - changes:
      - poetry.lock
      - pyproject.toml
      - Dockerfile

ruff-lint:
  parallel:
    matrix:
      - PYTHON_VERSION: [ "py311" ]

pyright-lint:
  parallel:
    matrix:
      - PYTHON_VERSION: [ "3.11" ]

pytest-39:
  rules:
    - when: never

pytest-310:
  rules:
    - when: never

pytest-312:
  rules:
    - when: never

app-build-and-push:
  extends: .base-docker
  stage: app-build-and-push
  variables:
    IMAGE_TAG_DEPS: "$CI_REGISTRY_IMAGE:deps"
    IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:latest"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG_DEPS || true  # Pull the deps image for caching
    - docker pull $IMAGE_TAG_LATEST || true  # Pull the last full image for caching
    - >
      docker build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from $IMAGE_TAG_DEPS
      --cache-from $IMAGE_TAG_LATEST
      -t $IMAGE_TAG
      -t $IMAGE_TAG_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST
  only:
    - main
